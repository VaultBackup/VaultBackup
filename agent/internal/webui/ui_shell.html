<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>VaultBackup Agent</title>
<style nonce="__CSP_NONCE__">
body{font-family:system-ui,sans-serif;background:#0a1018;color:#f1f5f9;margin:0;padding:1.25rem}
.shell{max-width:960px;margin:0 auto}
.card{background:#111a26;border:1px solid rgba(148,163,184,.14);border-radius:16px;padding:1.2rem;margin:1rem 0}
label{display:block;font-size:.8rem;color:#cbd5e1;margin:.4rem 0 .25rem}
input,select,textarea{width:100%;box-sizing:border-box;background:#0a121d;border:1px solid rgba(148,163,184,.14);border-radius:10px;color:#fff;padding:.65rem;margin:0}
.btn{border:0;border-radius:10px;padding:.65rem 1rem;font-weight:700;cursor:pointer}
.btn-primary{background:#22c55e;color:#fff}
.btn-ghost{background:transparent;border:1px solid rgba(148,163,184,.25);color:#cbd5e1}
.hidden{display:none!important}
.check{display:flex;align-items:center;gap:.5rem;margin:.5rem 0;font-size:.86rem}
.check input{width:auto}
.row{display:grid;grid-template-columns:1fr 1fr;gap:.75rem}
@media(max-width:700px){.row{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="shell">
  <h1>VaultBackup Agent</h1>
  <p>UI restore in progress — full dashboard will return shortly. Core APIs remain available.</p>
  <div class="card">
    <label for="dest_mode">Destination</label>
    <select id="dest_mode">
      <option value="local">Local</option>
      <option value="s3">S3</option>
      <option value="azure">Azure</option>
      <option value="webdav">WebDAV</option>
      <option value="sftp">SFTP</option>
    </select>
    <div id="dest-sftp" class="hidden">
      <div class="row">
        <div><label for="sftp_host">Host</label><input id="sftp_host"/></div>
        <div><label for="sftp_user">User</label><input id="sftp_user"/></div>
      </div>
      <label for="sftp_path">Path</label><input id="sftp_path" placeholder="/backups"/>
      <div class="row">
        <div><label for="sftp_password">Password</label><input id="sftp_password" type="password"/></div>
        <div><label for="sftp_key_file">Key file</label><input id="sftp_key_file"/></div>
      </div>
      <label class="check"><input type="checkbox" id="sftp_insecure"/> Skip host-key check (sftp_insecure — only for first deploy / lab)</label>
    </div>
  </div>
</div>
<script nonce="__CSP_NONCE__">
__APP_JS__
</script>
</body>
</html>
