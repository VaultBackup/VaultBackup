name: Deploy Worker

on:
  push:
    branches: [main]
    paths:
      - "worker.js"
      - "wrangler.toml"
      - "scripts/*.mjs"
      - ".github/workflows/deploy-worker.yml"
  workflow_dispatch:

concurrency:
  group: deploy-worker
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - run: node scripts/ensure-agent-msi-route.mjs worker.js
      - run: node scripts/embed-public-docs.mjs worker.js
      - run: node scripts/enhance-public-seo.mjs worker.js
      - run: node scripts/unify-favicon-humanize.mjs worker.js
      - run: node scripts/link-landing-nav.mjs worker.js
      - run: node scripts/go-live-hardening.mjs worker.js
      - run: node scripts/strip-install-github.mjs worker.js
      - run: node scripts/patch-support-page.mjs worker.js
      - run: node scripts/polish-dashboard-header.mjs worker.js
      - run: node scripts/fix-favicon-csp.mjs worker.js
      - run: node scripts/structural-connect-db.mjs worker.js

      - name: Syntax check
        run: node --check worker.js

      - name: Deploy
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CF_API_TOKEN }}
          accountId: ${{ secrets.CF_ACCOUNT_ID }}
          command: deploy
