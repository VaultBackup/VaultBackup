name: Deploy Worker

on:
  push:
    branches: [main]
    paths:
      - "worker.js"
      - "wrangler.toml"
      - "scripts/*.mjs"
      - ".github/workflows/deploy-worker.yml"
  workflow_dispatch:

concurrency:
  group: deploy-worker
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: MSI route + install UX
        run: node scripts/ensure-agent-msi-route.mjs worker.js

      - name: Public docs (incl. restore, privacy, support)
        run: node scripts/embed-public-docs.mjs worker.js

      - name: SEO enhancements
        run: node scripts/enhance-public-seo.mjs worker.js

      - name: Favicon + humanize
        run: node scripts/unify-favicon-humanize.mjs worker.js

      - name: Landing nav links
        run: node scripts/link-landing-nav.mjs worker.js

      - name: Go-live hardening (registration lock)
        run: node scripts/go-live-hardening.mjs worker.js

      - name: Syntax check
        run: node --check worker.js

      - name: Deploy
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CF_API_TOKEN }}
          accountId: ${{ secrets.CF_ACCOUNT_ID }}
          command: deploy
