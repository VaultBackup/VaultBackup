name: Deploy Worker

on:
  push:
    branches: [main]
    paths:
      - "worker.js"
      - "wrangler.toml"
      - "scripts/*.mjs"
      - ".github/workflows/deploy-worker.yml"
  workflow_dispatch:

concurrency:
  group: deploy-worker
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Ensure /download/windows-msi + install MSI UX
        run: node scripts/ensure-agent-msi-route.mjs worker.js

      - name: Embed public product docs (/docs)
        run: node scripts/embed-public-docs.mjs worker.js

      - name: SEO / AEO / GEO / XEO enhancements
        run: node scripts/enhance-public-seo.mjs worker.js

      - name: Unified favicon + humanize copy
        run: node scripts/unify-favicon-humanize.mjs worker.js

      - name: Syntax check worker.js
        run: node --check worker.js

      - name: Deploy to Cloudflare Workers
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CF_API_TOKEN }}
          accountId: ${{ secrets.CF_ACCOUNT_ID }}
          command: deploy

      - name: Summary
        run: |
          echo "### Worker deploy" >> "$GITHUB_STEP_SUMMARY"
          echo "- Favicon: /icon.svg and /favicon.ico" >> "$GITHUB_STEP_SUMMARY"
          echo "- Docs + install share the same icon" >> "$GITHUB_STEP_SUMMARY"
