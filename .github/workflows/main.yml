name: Build and Commit Agent Binaries

on:
  push:
    branches:
      - main
    paths:
      - '**.go'
      - 'go.mod'
      - 'go.sum'
      - 'config.example.yaml'

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: 'stable'

      - name: Install Dependencies
        run: |
          if [ -f go.mod ]; then
            go mod download
          fi

      - name: Build Binaries
        run: |
          # Build macOS targets
          GOOS=darwin GOARCH=amd64 go build -ldflags="-s -w" -o vaultbackup-agent-darwin-amd64 main.go
          GOOS=darwin GOARCH=arm64 go build -ldflags="-s -w" -o vaultbackup-agent-darwin-arm64 main.go

          # Build Linux targets
          GOOS=linux GOARCH=amd64 go build -ldflags="-s -w" -o vaultbackup-agent-linux-amd64 main.go
          GOOS=linux GOARCH=arm64 go build -ldflags="-s -w" -o vaultbackup-agent-linux-arm64 main.go

          # Build Windows targets
          GOOS=windows GOARCH=amd64 go build -ldflags="-s -w" -o vaultbackup-agent-windows-amd64.exe main.go
          GOOS=windows GOARCH=arm64 go build -ldflags="-s -w" -o vaultbackup-agent-windows-arm64.exe main.go

      - name: Commit and Push Binaries
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@://github.com"
          
          git add vaultbackup-agent-*
          
          # Only commit and push if changes exist to prevent infinite GHA run loops
          if git diff --cached --quiet; then
            echo "No changes in binaries detected. Skipping commit."
          else
            git commit -m "chore(build): automatically update deployment binaries [skip ci]"
            git push origin HEAD:${{ github.ref_name }}
          fi
