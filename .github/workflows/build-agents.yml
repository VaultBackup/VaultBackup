name: Build Agent Binaries

on:
  push:
    branches: [main]
    paths:
      - 'agent/**'
      - '.github/workflows/build-agents.yml'
  workflow_dispatch:

# One run at a time; do not cancel an in-progress build when a new one starts mid-push
concurrency:
  group: build-agents
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      - name: Build all platforms
        working-directory: agent
        run: |
          set -euo pipefail
          VERSION=$(git describe --tags --always --dirty 2>/dev/null || echo "1.2.3")
          LDFLAGS="-s -w -X main.version=${VERSION}"

          echo "Building version ${VERSION}..."

          GOOS=linux   GOARCH=amd64 go build -ldflags="$LDFLAGS" -o ../vaultbackup-agent-linux-amd64     ./cmd/agent
          GOOS=linux   GOARCH=arm64 go build -ldflags="$LDFLAGS" -o ../vaultbackup-agent-linux-arm64     ./cmd/agent
          GOOS=darwin  GOARCH=amd64 go build -ldflags="$LDFLAGS" -o ../vaultbackup-agent-darwin-amd64    ./cmd/agent
          GOOS=darwin  GOARCH=arm64 go build -ldflags="$LDFLAGS" -o ../vaultbackup-agent-darwin-arm64    ./cmd/agent
          GOOS=windows GOARCH=amd64 go build -ldflags="$LDFLAGS" -o ../vaultbackup-agent-windows-amd64.exe ./cmd/agent
          GOOS=windows GOARCH=arm64 go build -ldflags="$LDFLAGS" -o ../vaultbackup-agent-windows-arm64.exe ./cmd/agent

          ls -la ../vaultbackup-agent-*

      - name: Sign Windows binaries (Authenticode)
        env:
          WINDOWS_CERT_PFX_BASE64: ${{ secrets.WINDOWS_CERT_PFX_BASE64 }}
          WINDOWS_CERT_PASSWORD: ${{ secrets.WINDOWS_CERT_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -z "${WINDOWS_CERT_PFX_BASE64:-}" ]; then
            echo "WINDOWS_CERT_PFX_BASE64 not set — Windows binaries left unsigned."
            exit 0
          fi
          sudo apt-get update -qq
          sudo apt-get install -y -qq osslsigncode
          echo "$WINDOWS_CERT_PFX_BASE64" | base64 -d > /tmp/codesign.pfx
          for exe in vaultbackup-agent-windows-amd64.exe vaultbackup-agent-windows-arm64.exe; do
            echo "Signing $exe ..."
            osslsigncode sign -pkcs12 /tmp/codesign.pfx \
              -pass "${WINDOWS_CERT_PASSWORD}" \
              -n "VaultBackup Agent" \
              -i "https://backup.enadoctemp.workers.dev" \
              -t http://timestamp.digicert.com \
              -in "$exe" -out "${exe}.signed"
            mv "${exe}.signed" "$exe"
            osslsigncode verify -in "$exe" || true
          done
          rm -f /tmp/codesign.pfx
          echo "Windows Authenticode signing done."

      - name: SHA256 checksums
        run: |
          set -euo pipefail
          rm -f SHA256SUMS
          for f in \
            vaultbackup-agent-linux-amd64 \
            vaultbackup-agent-linux-arm64 \
            vaultbackup-agent-darwin-amd64 \
            vaultbackup-agent-darwin-arm64 \
            vaultbackup-agent-windows-amd64.exe \
            vaultbackup-agent-windows-arm64.exe
          do
            sha256sum "$f" >> SHA256SUMS
          done
          cat SHA256SUMS

      - name: GPG-sign checksums
        env:
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
        run: |
          set -euo pipefail
          if [ -z "${GPG_PRIVATE_KEY:-}" ]; then
            echo "GPG_PRIVATE_KEY not set — SHA256SUMS left unsigned."
            exit 0
          fi
          echo "$GPG_PRIVATE_KEY" | gpg --batch --import
          gpg --batch --yes --pinentry-mode loopback \
            --passphrase "${GPG_PASSPHRASE}" \
            --detach-sign --armor -o SHA256SUMS.asc SHA256SUMS
          gpg --verify SHA256SUMS.asc SHA256SUMS
          echo "GPG signature written to SHA256SUMS.asc"

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: agent-binaries
          path: |
            vaultbackup-agent-linux-amd64
            vaultbackup-agent-linux-arm64
            vaultbackup-agent-darwin-amd64
            vaultbackup-agent-darwin-arm64
            vaultbackup-agent-windows-amd64.exe
            vaultbackup-agent-windows-arm64.exe
            SHA256SUMS
            SHA256SUMS.asc
          if-no-files-found: warn

      - name: Commit and push binaries
        env:
          BRANCH: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add \
            vaultbackup-agent-linux-amd64 \
            vaultbackup-agent-linux-arm64 \
            vaultbackup-agent-darwin-amd64 \
            vaultbackup-agent-darwin-arm64 \
            vaultbackup-agent-windows-amd64.exe \
            vaultbackup-agent-windows-arm64.exe \
            SHA256SUMS || true
          if [ -f SHA256SUMS.asc ]; then git add SHA256SUMS.asc; fi

          if git diff --cached --quiet; then
            echo "No binary changes; skipping commit."
            exit 0
          fi

          git commit -m "chore(build): update agent binaries (signed when secrets present) [skip ci]"

          for i in 1 2 3 4 5; do
            git fetch origin "$BRANCH"
            if git push origin "HEAD:$BRANCH"; then
              echo "Push succeeded (attempt $i)"
              exit 0
            fi
            echo "Push rejected (attempt $i); rebasing onto origin/$BRANCH..."
            if ! git pull --rebase origin "$BRANCH"; then
              echo "Rebase conflict; aborting rebase and retrying after delay"
              git rebase --abort || true
            fi
            sleep $((i * 3))
          done
          echo "Failed to push binaries after 5 attempts"
          exit 1

  sign-macos:
    needs: build
    runs-on: macos-latest
    if: ${{ secrets.APPLE_CERTIFICATE_BASE64 != '' }}
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Download binaries
        uses: actions/download-artifact@v4
        with:
          name: agent-binaries
          path: dist

      - name: Import Apple certificate
        env:
          APPLE_CERTIFICATE_BASE64: ${{ secrets.APPLE_CERTIFICATE_BASE64 }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_KEYCHAIN_PASSWORD: ${{ secrets.APPLE_KEYCHAIN_PASSWORD }}
        run: |
          set -euo pipefail
          CERT_PATH="$RUNNER_TEMP/certificate.p12"
          KEYCHAIN="$RUNNER_TEMP/build.keychain-db"
          echo "$APPLE_CERTIFICATE_BASE64" | base64 -d > "$CERT_PATH"
          KC_PASS="${APPLE_KEYCHAIN_PASSWORD:-$(openssl rand -base64 24)}"
          security create-keychain -p "$KC_PASS" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KC_PASS" "$KEYCHAIN"
          security import "$CERT_PATH" -P "$APPLE_CERTIFICATE_PASSWORD" \
            -A -t cert -f pkcs12 -k "$KEYCHAIN"
          security list-keychain -d user -s "$KEYCHAIN"
          security set-key-partition-list -S apple-tool:,apple:,codesign: \
            -s -k "$KC_PASS" "$KEYCHAIN"

      - name: Codesign Darwin binaries
        env:
          APPLE_IDENTITY: ${{ secrets.APPLE_IDENTITY }}
        run: |
          set -euo pipefail
          ID="${APPLE_IDENTITY:-Developer ID Application}"
          ENTITLEMENTS="agent/packaging/macos/entitlements.plist"
          for bin in dist/vaultbackup-agent-darwin-amd64 dist/vaultbackup-agent-darwin-arm64; do
            chmod +x "$bin"
            if [ -f "$ENTITLEMENTS" ]; then
              codesign --force --options runtime --timestamp \
                --sign "$ID" --entitlements "$ENTITLEMENTS" "$bin"
            else
              codesign --force --options runtime --timestamp --sign "$ID" "$bin"
            fi
            codesign --verify --verbose "$bin"
            echo "Signed $bin"
          done

      - name: Notarize (optional)
        env:
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
          APPLE_API_KEY_BASE64: ${{ secrets.APPLE_API_KEY_BASE64 }}
        run: |
          set -euo pipefail
          if [ -z "${APPLE_API_KEY_BASE64:-}" ]; then
            echo "APPLE_API_KEY_BASE64 not set — skipping notarization."
            exit 0
          fi
          mkdir -p "$RUNNER_TEMP/private_keys"
          echo "$APPLE_API_KEY_BASE64" | base64 -d > "$RUNNER_TEMP/private_keys/AuthKey_${APPLE_API_KEY_ID}.p8"
          ditto -c -k --keepParent dist/vaultbackup-agent-darwin-arm64 dist/agent-darwin-arm64.zip
          ditto -c -k --keepParent dist/vaultbackup-agent-darwin-amd64 dist/agent-darwin-amd64.zip
          xcrun notarytool submit dist/agent-darwin-arm64.zip \
            --key "$RUNNER_TEMP/private_keys/AuthKey_${APPLE_API_KEY_ID}.p8" \
            --key-id "$APPLE_API_KEY_ID" \
            --issuer "$APPLE_API_ISSUER_ID" \
            --wait
          xcrun notarytool submit dist/agent-darwin-amd64.zip \
            --key "$RUNNER_TEMP/private_keys/AuthKey_${APPLE_API_KEY_ID}.p8" \
            --key-id "$APPLE_API_KEY_ID" \
            --issuer "$APPLE_API_ISSUER_ID" \
            --wait
          echo "Notarization complete."

      - name: Commit signed macOS binaries
        env:
          BRANCH: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          cp dist/vaultbackup-agent-darwin-amd64 vaultbackup-agent-darwin-amd64
          cp dist/vaultbackup-agent-darwin-arm64 vaultbackup-agent-darwin-arm64
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add vaultbackup-agent-darwin-amd64 vaultbackup-agent-darwin-arm64
          if git diff --cached --quiet; then
            echo "No macOS binary changes."
            exit 0
          fi
          git commit -m "chore(build): codesign macOS agent binaries [skip ci]"
          for i in 1 2 3 4 5; do
            git fetch origin "$BRANCH"
            if git push origin "HEAD:$BRANCH"; then
              echo "Push succeeded (attempt $i)"
              exit 0
            fi
            if ! git pull --rebase origin "$BRANCH"; then
              git rebase --abort || true
            fi
            sleep $((i * 3))
          done
          exit 1

  msi:
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      - name: Build Windows amd64 agent
        working-directory: agent
        shell: bash
        run: |
          set -euo pipefail
          RAW=$(git describe --tags --always --dirty 2>/dev/null || echo "1.2.3")
          if [[ "$RAW" =~ ^[0-9]+(\.[0-9]+){1,3}$ ]]; then
            VERSION="$RAW"
          else
            VERSION="1.2.3"
          fi
          echo "VERSION=${VERSION}" >> "$GITHUB_ENV"
          echo "Using MSI product version: ${VERSION} (raw git: ${RAW})"
          LDFLAGS="-s -w -X main.version=${RAW}"
          GOOS=windows GOARCH=amd64 go build -ldflags="$LDFLAGS" \
            -o packaging/windows/vaultbackup-agent-windows-amd64.exe ./cmd/agent
          ls -la packaging/windows/

      - name: Sign MSI payload exe (Authenticode)
        shell: bash
        env:
          WINDOWS_CERT_PFX_BASE64: ${{ secrets.WINDOWS_CERT_PFX_BASE64 }}
          WINDOWS_CERT_PASSWORD: ${{ secrets.WINDOWS_CERT_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -z "${WINDOWS_CERT_PFX_BASE64:-}" ]; then
            echo "No Windows cert — MSI payload left unsigned."
            exit 0
          fi
          echo "$WINDOWS_CERT_PFX_BASE64" | base64 -d > /tmp/codesign.pfx
          if command -v osslsigncode >/dev/null 2>&1; then
            osslsigncode sign -pkcs12 /tmp/codesign.pfx -pass "${WINDOWS_CERT_PASSWORD}" \
              -n "VaultBackup Agent" -i "https://backup.enadoctemp.workers.dev" \
              -t http://timestamp.digicert.com \
              -in agent/packaging/windows/vaultbackup-agent-windows-amd64.exe \
              -out agent/packaging/windows/vaultbackup-agent-windows-amd64.signed.exe
            mv agent/packaging/windows/vaultbackup-agent-windows-amd64.signed.exe \
               agent/packaging/windows/vaultbackup-agent-windows-amd64.exe
          else
            SIGNTOOL=$(find "/c/Program Files (x86)/Windows Kits" -name signtool.exe 2>/dev/null | head -1 || true)
            if [ -n "$SIGNTOOL" ]; then
              "$SIGNTOOL" sign /f /tmp/codesign.pfx /p "${WINDOWS_CERT_PASSWORD}" \
                /fd SHA256 /tr http://timestamp.digicert.com /td SHA256 \
                agent/packaging/windows/vaultbackup-agent-windows-amd64.exe
            else
              echo "No signing tool found on Windows runner — skipping."
            fi
          fi
          rm -f /tmp/codesign.pfx

      - name: Install WiX Toolset
        shell: pwsh
        run: |
          choco install wixtoolset --yes --no-progress
          $wixBin = Get-ChildItem -Path "${env:ProgramFiles(x86)}\WiX Toolset*" -Directory -ErrorAction SilentlyContinue |
            Sort-Object Name -Descending |
            Select-Object -First 1
          if (-not $wixBin) {
            throw "WiX Toolset not found after Chocolatey install"
          }
          $bin = Join-Path $wixBin.FullName "bin"
          echo "WIX_BIN=$bin" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          Write-Host "WiX bin: $bin"
          & (Join-Path $bin "candle.exe") -?

      - name: Ensure icon.ico exists
        working-directory: agent/packaging/windows
        shell: pwsh
        run: |
          if (Test-Path "icon.ico") {
            Write-Host "icon.ico already present"
            exit 0
          }
          $bytes = [byte[]](
            0x00,0x00,0x01,0x00,0x01,0x00,0x01,0x01,0x00,0x00,0x01,0x00,0x18,0x00,
            0x30,0x00,0x00,0x00,0x16,0x00,0x00,0x00,
            0x28,0x00,0x00,0x00,0x01,0x00,0x00,0x00,0x02,0x00,0x00,0x00,0x01,0x00,0x18,0x00,
            0x00,0x00,0x00,0x00,0x00,0x00,0x00,0x00,0x00,0x00,0x00,0x00,0x00,0x00,0x00,0x00,
            0x00,0x00,0x00,0x00,0x00,0x00,0x00,0x00,
            0x00,0x80,0x00,0x00,0x00,0x00,0x00,0x00,0x00,0x00,0x00,0x00
          )
          [IO.File]::WriteAllBytes((Join-Path (Get-Location) "icon.ico"), $bytes)
          Write-Host "Wrote minimal icon.ico ($($bytes.Length) bytes)"

      - name: Build MSI with WiX
        working-directory: agent/packaging/windows
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $candle = Join-Path $env:WIX_BIN "candle.exe"
          $light  = Join-Path $env:WIX_BIN "light.exe"

          $ver = $env:VERSION
          if ([string]::IsNullOrWhiteSpace($ver) -or ($ver -notmatch '^\d+(\.\d+){1,3}$')) {
            $ver = "1.2.3"
          }
          Write-Host "candle -dVersion=$ver"

          New-Item -ItemType Directory -Force -Path out | Out-Null

          $defineVersion = "-dVersion=$ver"
          & $candle $defineVersion "-arch" "x64" "-out" "out\VaultBackupAgent.wixobj" "VaultBackupAgent.wxs"
          if ($LASTEXITCODE -ne 0) { throw "candle failed (exit $LASTEXITCODE)" }

          $msiName = "vaultbackup-agent-$ver-x64.msi"
          & $light "-ext" "WixUIExtension" "-out" "out\$msiName" "out\VaultBackupAgent.wixobj"
          if ($LASTEXITCODE -ne 0) { throw "light failed (exit $LASTEXITCODE)" }

          $repoRoot = Resolve-Path "..\..\.."
          Copy-Item "out\$msiName" (Join-Path $repoRoot "vaultbackup-agent-windows-amd64.msi") -Force
          Copy-Item "out\$msiName" (Join-Path $repoRoot $msiName) -Force
          Get-ChildItem (Join-Path $repoRoot "*.msi") | Format-Table Name, Length

      - name: Commit and push MSI
        shell: bash
        env:
          BRANCH: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add vaultbackup-agent-windows-amd64.msi || true
          git add vaultbackup-agent-*-x64.msi || true

          if git diff --cached --quiet; then
            echo "No MSI changes; skipping commit."
            exit 0
          fi

          git commit -m "chore(build): update Windows MSI installer [skip ci]"

          for i in 1 2 3 4 5; do
            git fetch origin "$BRANCH"
            if git push origin "HEAD:$BRANCH"; then
              echo "Push succeeded (attempt $i)"
              exit 0
            fi
            echo "Push rejected (attempt $i); rebasing onto origin/$BRANCH..."
            if ! git pull --rebase origin "$BRANCH"; then
              echo "Rebase conflict; aborting rebase and retrying after delay"
              git rebase --abort || true
            fi
            sleep $((i * 3))
          done
          echo "Failed to push MSI after 5 attempts"
          exit 1
