name: Build Agent Binaries

on:
  push:
    branches: [main]
    paths:
      - 'agent/**'
      - '.github/workflows/build-agents.yml'
  workflow_dispatch:

concurrency:
  group: build-agents
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version: '1.22'
      - name: Build all platforms
        working-directory: agent
        run: |
          set -euo pipefail
          VERSION=$(git describe --tags --always --dirty 2>/dev/null || echo "1.2.7")
          LDFLAGS="-s -w -X main.version=${VERSION}"
          GOOS=linux   GOARCH=amd64 go build -ldflags="$LDFLAGS" -o ../vaultbackup-agent-linux-amd64     ./cmd/agent
          GOOS=linux   GOARCH=arm64 go build -ldflags="$LDFLAGS" -o ../vaultbackup-agent-linux-arm64     ./cmd/agent
          GOOS=darwin  GOARCH=amd64 go build -ldflags="$LDFLAGS" -o ../vaultbackup-agent-darwin-amd64    ./cmd/agent
          GOOS=darwin  GOARCH=arm64 go build -ldflags="$LDFLAGS" -o ../vaultbackup-agent-darwin-arm64    ./cmd/agent
          GOOS=windows GOARCH=amd64 go build -ldflags="$LDFLAGS" -o ../vaultbackup-agent-windows-amd64.exe ./cmd/agent
          GOOS=windows GOARCH=arm64 go build -ldflags="$LDFLAGS" -o ../vaultbackup-agent-windows-arm64.exe ./cmd/agent
          ls -la ../vaultbackup-agent-*
      - name: Sign Windows binaries (Authenticode)
        env:
          WINDOWS_CERT_PFX_BASE64: ${{ secrets.WINDOWS_CERT_PFX_BASE64 }}
          WINDOWS_CERT_PASSWORD: ${{ secrets.WINDOWS_CERT_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -z "${WINDOWS_CERT_PFX_BASE64:-}" ]; then echo "unsigned"; exit 0; fi
          sudo apt-get update -qq && sudo apt-get install -y -qq osslsigncode
          # Normalize secret (strip whitespace/newlines from base64)
          echo "$WINDOWS_CERT_PFX_BASE64" | tr -d ' \n\r\t' | base64 -d > /tmp/codesign.pfx
          for exe in vaultbackup-agent-windows-amd64.exe vaultbackup-agent-windows-arm64.exe; do
            osslsigncode sign -pkcs12 /tmp/codesign.pfx -pass "${WINDOWS_CERT_PASSWORD}" -n "VaultBackup Agent" -i "https://backup.enadoctemp.workers.dev" -t http://timestamp.digicert.com -in "$exe" -out "${exe}.signed"
            mv "${exe}.signed" "$exe"
          done
          rm -f /tmp/codesign.pfx
      - name: SHA256 checksums
        run: |
          rm -f SHA256SUMS
          for f in vaultbackup-agent-linux-amd64 vaultbackup-agent-linux-arm64 vaultbackup-agent-darwin-amd64 vaultbackup-agent-darwin-arm64 vaultbackup-agent-windows-amd64.exe vaultbackup-agent-windows-arm64.exe; do sha256sum "$f" >> SHA256SUMS; done
          cat SHA256SUMS
      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: agent-binaries
          path: |
            vaultbackup-agent-linux-amd64
            vaultbackup-agent-linux-arm64
            vaultbackup-agent-darwin-amd64
            vaultbackup-agent-darwin-arm64
            vaultbackup-agent-windows-amd64.exe
            vaultbackup-agent-windows-arm64.exe
            SHA256SUMS
          if-no-files-found: warn
      - name: Commit and push binaries
        env:
          BRANCH: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add vaultbackup-agent-linux-amd64 vaultbackup-agent-linux-arm64 \
                  vaultbackup-agent-darwin-amd64 vaultbackup-agent-darwin-arm64 \
                  vaultbackup-agent-windows-amd64.exe vaultbackup-agent-windows-arm64.exe \
                  SHA256SUMS || true
          if git diff --cached --quiet; then echo "No binary changes"; exit 0; fi
          git commit -m "chore(build): update agent binaries [skip ci]"
          for i in 1 2 3 4 5 6 8 10; do
            git fetch origin "$BRANCH"
            if git push origin "HEAD:$BRANCH"; then
              echo "Pushed binaries"
              exit 0
            fi
            echo "Push rejected (attempt $i); rebasing with ours for binaries…"
            if ! git pull --rebase origin "$BRANCH"; then
              git checkout --ours -- \
                vaultbackup-agent-linux-amd64 vaultbackup-agent-linux-arm64 \
                vaultbackup-agent-darwin-amd64 vaultbackup-agent-darwin-arm64 \
                vaultbackup-agent-windows-amd64.exe vaultbackup-agent-windows-arm64.exe \
                SHA256SUMS 2>/dev/null || true
              git add vaultbackup-agent-linux-amd64 vaultbackup-agent-linux-arm64 \
                      vaultbackup-agent-darwin-amd64 vaultbackup-agent-darwin-arm64 \
                      vaultbackup-agent-windows-amd64.exe vaultbackup-agent-windows-arm64.exe \
                      SHA256SUMS 2>/dev/null || true
              GIT_EDITOR=true git rebase --continue || git rebase --abort || true
            fi
            sleep $((i * 2))
          done
          exit 1

  sign-macos:
    needs: build
    runs-on: macos-latest
    permissions:
      contents: write
    steps:
      - name: Check Apple certificate secret
        id: apple
        env:
          APPLE_CERTIFICATE_BASE64: ${{ secrets.APPLE_CERTIFICATE_BASE64 }}
        run: |
          if [ -z "${APPLE_CERTIFICATE_BASE64:-}" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "No APPLE_CERTIFICATE_BASE64 — skipping codesign."
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Checkout
        if: steps.apple.outputs.skip != 'true'
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0
      - name: Download binaries
        if: steps.apple.outputs.skip != 'true'
        uses: actions/download-artifact@v4
        with:
          name: agent-binaries
          path: dist
      - name: Import Apple certificate
        id: import
        if: steps.apple.outputs.skip != 'true'
        continue-on-error: true
        env:
          APPLE_CERTIFICATE_BASE64: ${{ secrets.APPLE_CERTIFICATE_BASE64 }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_KEYCHAIN_PASSWORD: ${{ secrets.APPLE_KEYCHAIN_PASSWORD }}
        run: |
          set -euo pipefail
          CERT_PATH="$RUNNER_TEMP/certificate.p12"
          KEYCHAIN="$RUNNER_TEMP/build.keychain-db"

          # Normalize base64 (GitHub UI / paste often adds newlines)
          echo "$APPLE_CERTIFICATE_BASE64" | tr -d ' \n\r\t' | base64 -d > "$CERT_PATH"
          CERT_SIZE=$(wc -c < "$CERT_PATH" | tr -d ' ')
          echo "Decoded P12 size: ${CERT_SIZE} bytes"
          if [ "$CERT_SIZE" -lt 500 ]; then
            echo "::error::P12 too small (${CERT_SIZE}b) — base64 secret is truncated or invalid"
            exit 1
          fi

          # Strip accidental whitespace from password secret
          P12_PASS=$(printf '%s' "${APPLE_CERTIFICATE_PASSWORD:-}" | tr -d '\n\r')
          if [ -z "$P12_PASS" ]; then
            echo "::error::APPLE_CERTIFICATE_PASSWORD is empty"
            exit 1
          fi

          KC_PASS="${APPLE_KEYCHAIN_PASSWORD:-$(openssl rand -base64 24)}"
          security create-keychain -p "$KC_PASS" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KC_PASS" "$KEYCHAIN"
          security list-keychain -d user -s "$KEYCHAIN"

          # Import full PKCS#12 (cert + private key). Do NOT use -t cert (drops the key).
          # -A allows codesign without GUI prompt on CI.
          if ! security import "$CERT_PATH" -k "$KEYCHAIN" -P "$P12_PASS" -A -f pkcs12 -T /usr/bin/codesign -T /usr/bin/security; then
            echo "::error::security import failed (wrong password, corrupt P12, or not a PKCS#12)"
            echo "Hint: openssl pkcs12 -legacy -in cert.p12 -passin pass:YOUR_PASS -nokeys -info"
            exit 1
          fi

          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KC_PASS" "$KEYCHAIN" || true
          security find-identity -v -p codesigning "$KEYCHAIN" || true
          echo "imported=true" >> "$GITHUB_OUTPUT"
          echo "KEYCHAIN_PATH=$KEYCHAIN" >> "$GITHUB_ENV"
          echo "KEYCHAIN_PASS=$KC_PASS" >> "$GITHUB_ENV"
          rm -f "$CERT_PATH"

      - name: Codesign Darwin binaries
        if: steps.apple.outputs.skip != 'true' && steps.import.outcome == 'success'
        env:
          APPLE_IDENTITY: ${{ secrets.APPLE_IDENTITY }}
        run: |
          set -euo pipefail
          # Prefer explicit identity; fall back to first available codesigning identity in keychain
          ID="${APPLE_IDENTITY:-}"
          if [ -z "$ID" ] || [ "$ID" = "Developer ID Application" ]; then
            ID=$(security find-identity -v -p codesigning "${KEYCHAIN_PATH:-}" 2>/dev/null | awk -F'"' '/Developer ID Application|Apple Development|Mac Developer/{print $2; exit}')
          fi
          if [ -z "$ID" ]; then
            echo "::error::No codesigning identity found. Set APPLE_IDENTITY to the cert CN."
            security find-identity -v -p codesigning || true
            exit 1
          fi
          echo "Using identity: $ID"

          ENTITLEMENTS="agent/packaging/macos/entitlements.plist"
          for bin in dist/vaultbackup-agent-darwin-amd64 dist/vaultbackup-agent-darwin-arm64; do
            chmod +x "$bin"
            # Prefer hardened runtime + timestamp; fall back without timestamp for self-signed certs
            if [ -f "$ENTITLEMENTS" ]; then
              if ! codesign --force --options runtime --timestamp --sign "$ID" --entitlements "$ENTITLEMENTS" "$bin" 2>/tmp/cs.err; then
                echo "codesign with timestamp failed; retrying without timestamp (self-signed?)"
                cat /tmp/cs.err || true
                codesign --force --options runtime --sign "$ID" --entitlements "$ENTITLEMENTS" "$bin"
              fi
            else
              if ! codesign --force --options runtime --timestamp --sign "$ID" "$bin" 2>/tmp/cs.err; then
                echo "codesign with timestamp failed; retrying without timestamp"
                cat /tmp/cs.err || true
                codesign --force --options runtime --sign "$ID" "$bin"
              fi
            fi
            codesign --verify --verbose "$bin"
            echo "Signed $bin"
          done

      - name: Notarize (optional)
        if: steps.apple.outputs.skip != 'true' && steps.import.outcome == 'success'
        continue-on-error: true
        env:
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
          APPLE_API_KEY_BASE64: ${{ secrets.APPLE_API_KEY_BASE64 }}
        run: |
          set -euo pipefail
          if [ -z "${APPLE_API_KEY_BASE64:-}" ]; then
            echo "APPLE_API_KEY_BASE64 not set — skipping notarization."
            exit 0
          fi
          mkdir -p "$RUNNER_TEMP/private_keys"
          echo "$APPLE_API_KEY_BASE64" | tr -d ' \n\r\t' | base64 -d > "$RUNNER_TEMP/private_keys/AuthKey_${APPLE_API_KEY_ID}.p8"
          ditto -c -k --keepParent dist/vaultbackup-agent-darwin-arm64 dist/agent-darwin-arm64.zip
          ditto -c -k --keepParent dist/vaultbackup-agent-darwin-amd64 dist/agent-darwin-amd64.zip
          xcrun notarytool submit dist/agent-darwin-arm64.zip --key "$RUNNER_TEMP/private_keys/AuthKey_${APPLE_API_KEY_ID}.p8" --key-id "$APPLE_API_KEY_ID" --issuer "$APPLE_API_ISSUER_ID" --wait
          xcrun notarytool submit dist/agent-darwin-amd64.zip --key "$RUNNER_TEMP/private_keys/AuthKey_${APPLE_API_KEY_ID}.p8" --key-id "$APPLE_API_KEY_ID" --issuer "$APPLE_API_ISSUER_ID" --wait
          echo "Notarization complete."

      - name: Commit signed macOS binaries
        if: steps.apple.outputs.skip != 'true' && steps.import.outcome == 'success'
        env:
          BRANCH: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          cp dist/vaultbackup-agent-darwin-amd64 vaultbackup-agent-darwin-amd64
          cp dist/vaultbackup-agent-darwin-arm64 vaultbackup-agent-darwin-arm64
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add vaultbackup-agent-darwin-amd64 vaultbackup-agent-darwin-arm64
          if git diff --cached --quiet; then echo "No macOS binary changes."; exit 0; fi
          git commit -m "chore(build): codesign macOS agent binaries [skip ci]"
          for i in 1 2 3 4 5 6 8 10; do
            git fetch origin "$BRANCH"
            if git push origin "HEAD:$BRANCH"; then exit 0; fi
            if ! git pull --rebase origin "$BRANCH"; then
              git checkout --ours -- vaultbackup-agent-darwin-amd64 vaultbackup-agent-darwin-arm64 2>/dev/null || true
              git add vaultbackup-agent-darwin-amd64 vaultbackup-agent-darwin-arm64 2>/dev/null || true
              GIT_EDITOR=true git rebase --continue || git rebase --abort || true
            fi
            sleep $((i * 2))
          done
          exit 1

      - name: Report macOS sign status
        if: always() && steps.apple.outputs.skip != 'true'
        run: |
          if [ "${{ steps.import.outcome }}" = "success" ]; then
            echo "macOS certificate imported; codesign steps ran."
          else
            echo "::warning::macOS codesign skipped — certificate import failed."
            echo "Check APPLE_CERTIFICATE_BASE64 (single-line base64) and APPLE_CERTIFICATE_PASSWORD."
            echo "Pipeline remains green; Darwin binaries are unsigned."
          fi

  msi:
    needs: build
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version: '1.22'
      - name: Build Windows amd64 agent
        working-directory: agent
        shell: bash
        run: |
          set -euo pipefail
          RAW=$(git describe --tags --always --dirty 2>/dev/null || echo "1.2.7")
          if [[ "$RAW" =~ ^[0-9]+(\.[0-9]+){1,3}$ ]]; then VERSION="$RAW"; else VERSION="1.2.7"; fi
          echo "VERSION=${VERSION}" >> "$GITHUB_ENV"
          LDFLAGS="-s -w -X main.version=${RAW}"
          GOOS=windows GOARCH=amd64 go build -ldflags="$LDFLAGS" -o packaging/windows/vaultbackup-agent-windows-amd64.exe ./cmd/agent
          ls -la packaging/windows/
      - name: Install WiX Toolset
        shell: pwsh
        run: |
          choco install wixtoolset --yes --no-progress
          $wixBin = Get-ChildItem -Path "${env:ProgramFiles(x86)}\WiX Toolset*" -Directory -ErrorAction SilentlyContinue | Sort-Object Name -Descending | Select-Object -First 1
          if (-not $wixBin) { throw "WiX not found" }
          $bin = Join-Path $wixBin.FullName "bin"
          echo "WIX_BIN=$bin" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
      - name: Ensure icon.ico exists
        working-directory: agent/packaging/windows
        shell: pwsh
        run: |
          if (Test-Path "icon.ico") { exit 0 }
          $bytes = [byte[]](0x00,0x00,0x01,0x00,0x01,0x00,0x01,0x01,0x00,0x00,0x01,0x00,0x18,0x00,0x30,0x00,0x00,0x00,0x16,0x00,0x00,0x00,0x28,0x00,0x00,0x00,0x01,0x00,0x00,0x00,0x02,0x00,0x00,0x00,0x01,0x00,0x18,0x00,0x00,0x00,0x00,0x00,0x00,0x00,0x00,0x00,0x00,0x00,0x00,0x00,0x00,0x00,0x00,0x00,0x00,0x00,0x00,0x00,0x00,0x00,0x00,0x00,0x00,0x80,0x00,0x00,0x00,0x00,0x00,0x00,0x00,0x00,0x00,0x00)
          [IO.File]::WriteAllBytes((Join-Path (Get-Location) "icon.ico"), $bytes)
      - name: Build MSI with WiX
        working-directory: agent/packaging/windows
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $candle = Join-Path $env:WIX_BIN "candle.exe"
          $light  = Join-Path $env:WIX_BIN "light.exe"
          $ver = $env:VERSION
          if ([string]::IsNullOrWhiteSpace($ver) or ($ver -notmatch '^\d+(\.\d+){1,3}$')) { $ver = "1.2.7" }
          New-Item -ItemType Directory -Force -Path out | Out-Null
          if (-not (Test-Path "License.rtf")) { throw "License.rtf missing — EULA would be Lorem ipsum" }
          $lic = (Resolve-Path "License.rtf").Path
          Write-Host "Embedding license RTF: $lic"
          & $candle "-dVersion=$ver" "-dLicenseRtf=$lic" "-arch" "x64" "-out" "out\VaultBackupAgent.wixobj" "VaultBackupAgent.wxs"
          if ($LASTEXITCODE -ne 0) { throw "candle failed" }
          $msiName = "vaultbackup-agent-$ver-x64.msi"
          & $light "-ext" "WixUIExtension" "-sice:ICE38" "-sice:ICE43" "-sice:ICE57" "-out" "out\$msiName" "out\VaultBackupAgent.wixobj"
          if ($LASTEXITCODE -ne 0) { throw "light failed" }
          $repoRoot = Resolve-Path "..\..\.."
          Copy-Item "out\$msiName" (Join-Path $repoRoot "vaultbackup-agent-windows-amd64.msi") -Force
          Copy-Item "out\$msiName" (Join-Path $repoRoot $msiName) -Force
          Get-ChildItem (Join-Path $repoRoot "*.msi") | Format-Table Name, Length
      - name: Commit and push MSI
        shell: bash
        env:
          BRANCH: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add vaultbackup-agent-windows-amd64.msi || true
          git add vaultbackup-agent-*-x64.msi || true
          if git diff --cached --quiet; then echo "No MSI changes"; exit 0; fi
          git commit -m "chore(build): update Windows MSI installer [skip ci]"
          for i in 1 2 3 4 5 6 8 10; do
            git fetch origin "$BRANCH"
            if git push origin "HEAD:$BRANCH"; then exit 0; fi
            if ! git pull --rebase origin "$BRANCH"; then
              git checkout --ours -- vaultbackup-agent-windows-amd64.msi vaultbackup-agent-*-x64.msi 2>/dev/null || true
              git add vaultbackup-agent-windows-amd64.msi vaultbackup-agent-*-x64.msi 2>/dev/null || true
              GIT_EDITOR=true git rebase --continue || git rebase --abort || true
            fi
            sleep $((i * 2))
          done
          exit 1
