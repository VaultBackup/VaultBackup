# Cloudflare Worker — https://backup.enadoctemp.workers.dev/
# Deploy: npx wrangler deploy
# CI secrets: CF_API_TOKEN, CF_ACCOUNT_ID
#
# Install + docs are patched at deploy:
#   scripts/ensure-agent-msi-route.mjs
#   scripts/embed-public-docs.mjs

name = "backup"
main = "worker.js"
compatibility_date = "2024-11-01"
workers_dev = true

[triggers]
crons = [ "0,5,10,15,20,25,30,35,40,45,50,55 * * * *" ]

# Keep this binding on every deploy (id from Cloudflare KV dashboard)
[[kv_namespaces]]
binding = "backup_kv"
id = "afbbd4935a1e49db8f414cb8691b1c8d"
